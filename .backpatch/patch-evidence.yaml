    note: Carried from 5.14.5.1-backpatch-00002; ported onto 5.14.5; fixed at 5.14.5.1-backpatch-00002 (backpatch-activemq@5fe34ce..320cdbf). Clients connecting over ssl:// now check the broker's host name against its certificate by default, as in upstream's fix, so a client whose broker certificate does not name the host it connects to now fails to connect. Server connectors and the nio+ssl transport keep the check off by default, as upstream settled on; transport.verifyHostName=true turns it on for a server connector.
