    upstream_fix_url: https://github.com/advisories/GHSA-mhp6-f224-j2c3
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-54475
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-activemq/compare/e7a7680~1...70ea85f
    basis: adapted
    artifacts:
      - org.apache.activemq:activemq-client
      - org.apache.activemq:activemq-broker
      - org.apache.activemq:activemq-stomp
      - org.apache.activemq:activemq-mqtt
      - org.apache.activemq:activemq-amqp
      - org.apache.activemq:activemq-web
      - org.apache.activemq:activemq-jdbc-store
      - org.apache.activemq:activemq-spring
      - org.apache.activemq:activemq-all
      - org.apache.activemq:activemq-osgi
      - org.apache.activemq:activemq-rar
      - org.apache.activemq:activemq-web-console
      - org.apache.activemq:apache-activemq
    note: Carried from 5.16.8.1-backpatch-00012; ported onto 5.16.8; fixed at 5.16.8.1-backpatch-00012 (backpatch-activemq@e7a7680..70ea85f). Temporary queues and topics now refuse a consumer from any connection other than the one that created them, as in upstream 5.19.8. A network bridge without advisories that statically includes temporary queues is refused (InvalidDestinationException) when it subscribes to another connection's temporary queue, so request and reply over such a bridge stops working. Bridges between trusted brokers can set allowTempDestinationStealing="true" on a tempQueue or tempTopic policy entry, which leaves the CVE open for those destinations.
