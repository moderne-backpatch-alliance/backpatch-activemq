    note: New in this release; ported onto 5.16.8; fixed at 5.16.8.1-backpatch-00004 (backpatch-activemq@ff8ae59). A vm:// connection whose brokerConfig names a broker factory scheme, such as vm://localhost?brokerConfig=xbean:activemq.xml, is now refused by default, as in upstream's fix, so an application that starts an embedded broker that way now fails to connect. Upstream also hardened the default broker, web console and Jolokia configuration files of its distribution in 5.19.7; those files are not in these jars and are not changed here.
