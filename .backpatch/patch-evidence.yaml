    note: New in this release; ported onto 5.16.8; fixed at 5.16.8.1-backpatch-00008 (backpatch-activemq@e47b34c). Classes that FactoryFinder loads must now be of the type the caller asks for, and STOMP frame translators and web console queue browse views must also be on an allow list, as in upstream's fix. An application with its own frame translator or queue browse view outside the default list now fails to load it. The lists are set with the system properties org.apache.activemq.stomp.FRAME_TRANSLATOR_CLASSES and org.apache.activemq.web.view.QUEUE_BROWSE_CLASSES.
