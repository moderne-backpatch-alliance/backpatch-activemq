    note: Carried from 5.14.5.1-backpatch-00004; ported onto 5.14.5; fixed at 5.14.5.1-backpatch-00004 (backpatch-activemq@872e6fe..0cb680b). Classes that FactoryFinder loads must now be of the type the caller asks for, and STOMP frame translators and web console queue browse views must also be on an allow list, as in upstream's fix. An application with its own frame translator or queue browse view outside the default list now fails to load it. The lists are set with the system properties org.apache.activemq.stomp.FRAME_TRANSLATOR_CLASSES and org.apache.activemq.web.view.QUEUE_BROWSE_CLASSES.
