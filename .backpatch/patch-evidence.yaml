  result: pass
  note: "10313 tests at the patch commit, 324 of them skipped by the suite, 3 failed or errored: 2 accepted named exceptions, and known flake org.apache.activemq.transport.amqp.interop.AmqpExpiredMessageTest#testSendMessageThatIsExpiredUsingTTLWhenAbsoluteIsZero (Peter, 2026-11-12). Ran, failed and accepted as named exceptions: org.apache.activemq.transport.https.HttpsClientSettingsHostnameVerificationDisabledTest#testSendReceive (red at the baseline 5.16.8 too, in the devpod full suite (Peter, 2026-11-12)); org.apache.activemq.transport.tcp.TcpTransportInactiveDuringHandshakeTest#testInactivityMonitorThreadCompletesWhenFiringDuringStart (red at the baseline 5.16.8 too, in the devpod full suite (Peter, 2026-11-12)). The suite ran on 2026-11-11 on a devpod, not in Docker on the Mac, at this patch commit. From 00004 to 00010 the suite ran in Docker (azul/zulu-openjdk:8) after a suite hang on macOS; 00001 to 00003 ran on macOS. The default backpatch Maven extension resolves activemq-client's tests jar for activemq-openwire-legacy's test compile at the baseline 5.16.8; that is test scope in a module this line does not publish, so no published artifact changes. 00011, the line's last counter, ran the full suite instead of the CVE test classes."
