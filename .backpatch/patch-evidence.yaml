    upstream_fix_url: https://github.com/advisories/GHSA-mhp6-f224-j2c3
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-54475
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-activemq/compare/5b95a5c~1...99c1a2b
    basis: adapted
    artifacts:
