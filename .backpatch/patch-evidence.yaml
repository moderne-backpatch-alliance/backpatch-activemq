      - org.apache.activemq:activemq-osgi
      - org.apache.activemq:activemq-rar
      - org.apache.activemq:activemq-web-console
      - org.apache.activemq:apache-activemq
    note: Carried from 5.14.5.1-backpatch-00014; ported onto 5.14.5; fixed at 5.14.5.1-backpatch-00014 (backpatch-activemq@5b95a5c..99c1a2b). Temporary queues and topics now refuse a consumer from any connection other than the one that created them, as in upstream 5.19.8. A network bridge without advisories that statically includes temporary queues is refused (InvalidDestinationException) when it subscribes to another connection's temporary queue, so request and reply over such a bridge stops working. Bridges between trusted brokers can set allowTempDestinationStealing="true" on a tempQueue or tempTopic policy entry, which leaves the CVE open for those destinations. This release ships with RequestReplyNoAdvisoryNetworkTest's three tests failing for that reason and AMQ3274Test failing intermittently.
